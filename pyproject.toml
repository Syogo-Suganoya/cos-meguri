[project]
name = "cos-meguri"
version = "0.1.0"
description = "コスめぐり — レイヤーの一日エージェント"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "google-adk>=1.0.0",
    "google-cloud-firestore>=2.16",
    "pyjwt>=2.9",
    "firebase-admin>=6.5",
    # YouCam の S2S 認証で RSA 暗号化に使う（間接依存に頼らず明示する）
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
