services:
  api:
    build: .
    ports:
      # 8080 が埋まっている環境では HOST_PORT=8081 のように上書きする
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: 8080
      APP_ENV: local
      # モック / 実API の差し替えスイッチ（キーが無ければ自動で mock に落ちる）
      EKISPERT_MODE: ${EKISPERT_MODE:-mock}       # 経路                mock | live
      GEMINI_MODE: ${GEMINI_MODE:-mock}           # 言い回し・翻訳      mock | live
      REPOSITORY: ${REPOSITORY:-firestore}        # firestore | memory（memory はテスト専用）
      # 認証。ローカルも Firebase Authentication で、下の firebase-auth（エミュレータ）に繋ぐ。
      # エミュレータはどんな API キーでも受けるので、プロジェクトIDだけ揃えればよい
      AUTH_MODE: firebase
      FIREBASE_PROJECT_ID: cos-meguri-local
      FIREBASE_WEB_API_KEY: local-emulator-key
      # サーバから見た場所と、ブラウザから見た場所。本番ではどちらも絶対に設定しない
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      FIREBASE_AUTH_EMULATOR_URL: http://localhost:${AUTH_EMULATOR_PORT:-9099}
      # 実APIに差し替えるときだけ設定する
      EKISPERT_API_KEY: ${EKISPERT_API_KEY:-}
      EKISPERT_MCP_URL: ${EKISPERT_MCP_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-cos-meguri-local}
      # ローカルは常にエミュレータを見る。本番では未設定にして実 Firestore に繋ぐ
      FIRESTORE_EMULATOR_HOST: ${FIRESTORE_EMULATOR_HOST:-firestore:8200}
    volumes:
      - ./app:/app/app
      - ./web:/app/web
      - ./tests:/app/tests
    depends_on:
      firestore:
        condition: service_healthy
      firebase-auth:
        condition: service_healthy
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080} --reload"

  # テスト実行用: docker compose --profile test run --rm test
  # テストはインメモリで回す。1件ずつ独立させたいのと、速さのため
  test:
    build: .
    profiles: ["test"]
    environment:
      APP_ENV: test
      REPOSITORY: memory
      AUTH_MODE: dev   # パスワードを確かめないテスト用ログイン。APP_ENV=test でしか起動しない
    volumes:
      - ./app:/app/app
      - ./web:/app/web
      - ./tests:/app/tests
    command: pytest -q

  # Firestore アダプタの結合テスト: docker compose --profile itest run --rm test-firestore
  # エミュレータに実際に読み書きする。アダプタを触ったら必ず通すこと
  test-firestore:
    build: .
    profiles: ["itest"]
    environment:
      APP_ENV: test
      REPOSITORY: firestore
      GOOGLE_CLOUD_PROJECT: cos-meguri-local
      FIRESTORE_EMULATOR_HOST: firestore:8200
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    depends_on:
      firestore:
        condition: service_healthy
    command: pytest -q tests/test_firestore.py

  # アーキテクチャ図の生成: docker compose --profile docs run --rm diagram
  diagram:
    build:
      context: .
      dockerfile: docs/Dockerfile
    profiles: ["docs"]
    volumes:
      - ./docs:/work/docs

  # データの保存先。api と一緒に立ち上がる
  firestore:
    image: google/cloud-sdk:emulators
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8200
      --project=cos-meguri-local
    ports:
      - "${FIRESTORE_PORT:-8210}:8200"
    healthcheck:
      # 起動前に api が繋ぎにいくと初回リクエストが落ちるので、待ってから上げる
      test: ["CMD", "curl", "-f", "http://localhost:8200/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ログインの相手。api と一緒に立ち上がる。本番の Firebase Authentication と同じ
  # REST（メール＋パスワード）を喋るので、ログイン画面もトークンの検証も本番と同じコードで通る。
  # アカウントはメモリに持つので、docker compose down で消える
  firebase-auth:
    build: docker/auth-emulator
    ports:
      # ブラウザが直接ログインしにくるので、ホストにも出す
      - "${AUTH_EMULATOR_PORT:-9099}:9099"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9099/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # 画面操作イメージの撮影: docker compose up -d api のあと
  #   docker compose --profile shots run --rm shots
  # 利用者と同じ順に操作して web/shots/ に書き出す（トップページと README が同じ画像を使う）
  shots:
    profiles: ["shots"]
    build: docker/shots
    user: root
    working_dir: /work
    environment:
      BASE_URL: http://api:8080
      NODE_PATH: /usr/src/app/node_modules
      # 画面の時刻は日本時間で出しているが、ブラウザの「いま」も揃えておく
      TZ: Asia/Tokyo
    entrypoint: ["node", "docs/shots.js"]
    volumes:
      - ./docs:/work/docs
      - ./web:/work/web
