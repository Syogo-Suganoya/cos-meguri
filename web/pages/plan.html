<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="プラン — コスめぐり">プラン — コスめぐり</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0b10">
<!-- 英語を選んでいる人には、訳し終えるまで本文を隠す（日本語が一瞬見えないように）。core/i18n.js が外す。
     スクリプトが読めなかったときに白いままにならないよう、2秒で必ず外す -->
<script>try{if(localStorage.getItem("cos-meguri.lang")==="en"){var d=document.documentElement;d.lang="en";d.classList.add("i18n-pending");setTimeout(function(){d.classList.remove("i18n-pending")},2000)}}catch(e){}</script>
<link rel="stylesheet" href="/static/style.css?v=76">
</head>
<body class="p-plan">
<!-- 看板と帯の置き場所。中身は core/shell.js が通信を待たずに描く（先に場所を取らないと、描いた瞬間に本文が飛ぶ） -->
<header class="top" data-authed></header>
<nav class="rail" aria-label="進みぐあい" data-i18n-aria-label="進みぐあい" data-step="plan"></nav>

<main>
  <h1 class="page-title" data-i18n="プラン">プラン</h1>
  <p class="page-lead" data-i18n="相談で組み立てた一日ぶん。条件を直すと、ここも組み直します。">相談で組み立てた一日ぶん。条件を直すと、ここも組み直します。</p>

  <!-- ゲストにだけ出す。plan.js が通信を待たずに開く（手元の控えで判断する） -->
  <aside id="guest-promo" class="guest-promo" hidden>
    <p data-i18n="ログインすると、メイクの工程と動線を ☆ でお気に入りに残せます。いま組んだプランもそのまま引き継ぎます。">ログインすると、メイクの工程と動線を ☆ でお気に入りに残せます。いま組んだプランもそのまま引き継ぎます。</p>
    <div class="promo-actions">
      <a class="btn primary" data-auth-link="signup" href="/signup?next=/plan" data-i18n="新規登録">新規登録</a>
      <a class="btn" data-auth-link="login" href="/login?next=/plan" data-i18n="ログイン">ログイン</a>
    </div>
  </aside>

  <section class="card">
    <!-- ☆ を押した結果はここ1か所 -->
    <div id="fav-note" class="form-alert" role="status" hidden></div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="makeup" data-i18n="メイクの工程">メイクの工程</button>
      <button class="tab" data-tab="route" data-i18n="動線">動線</button>
    </div>
    <div id="pane-makeup" class="pane"></div>
    <div id="pane-route" class="pane hidden"></div>
  </section>

  <p class="page-note" data-i18n-html="plan.note">日付や出発駅を変えたくなったら <a href="/ask">相談</a> で直せます。</p>
</main>

<script type="module" src="/static/js/pages/plan.js?v=76"></script>
</body>
</html>
