<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>できあがり — コスめぐり</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0b10">
<link rel="stylesheet" href="/static/style.css?v=41">
</head>
<body class="p-looks">

<main>
  <h1 class="page-title">できあがり</h1>
  <p class="page-lead">完成の予想図と、耳で聞ける案内。どちらも AI がつくったものだと分かるようにして出します。</p>

  <div id="looks-gate"></div>

  <section class="card hidden" data-needs-plan>
    <h2>完成イメージ</h2>
    <p class="note">ウィッグ×衣装×メイクの完成予想図をつくります。作る前・買う前に方向を確かめるためのものです。</p>
    <div class="grid">
      <label>こうしたい（任意）<input id="look-note" placeholder="例: 全身、明るい照明で"></label>
    </div>
    <div class="actions">
      <button id="btn-look" class="primary">完成イメージをつくる</button>
    </div>
    <div id="look-out" class="out"></div>
  </section>

  <section class="card hidden" data-needs-plan>
    <h2>読み上げてもらう</h2>
    <p class="note">移動中とメイク中は画面を見られません。工程と動線を声で読み上げます。声の複製（ボイスクローン）は使いません。</p>
    <div class="actions">
      <button id="btn-voice-makeup" class="primary">メイクの工程を読み上げ</button>
      <button id="btn-voice-route">動線を読み上げ</button>
    </div>
    <div id="voice-out" class="out"></div>
  </section>
</main>

<script type="module" src="/static/js/pages/looks.js?v=41"></script>
</body>
</html>
