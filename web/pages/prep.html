<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>準備 — コスめぐり</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0b10">
<link rel="stylesheet" href="/static/style.css?v=45">
</head>
<body class="p-prep">

<main>
  <h1 class="page-title">準備</h1>
  <p class="page-lead">顔を登録すると、メイクの工程があなたに合います。試着の候補はプランを組むと出ます。</p>

  <section class="card">
    <h2>コス名</h2>
    <p class="note">合わせに呼ばれるときの名前です。いつでも変えられます。最初の名前は端末ごとに自動でつけた仮のものです。</p>
    <div class="grid">
      <label>コス名<input id="handle" maxlength="40" placeholder="例: ミナト"></label>
    </div>
    <div class="actions">
      <button id="btn-handle" class="primary">この名前にする</button>
    </div>
    <div id="handle-out" class="out"></div>
  </section>

  <section class="card">
    <h2>顔を登録する</h2>
    <p class="note">写真は<strong>解析のあとすぐ消します</strong>。残るのは肌タイプと顔立ちの数値だけで、消したことも記録に残ります。明るいところで、正面から、前髪を上げて撮ると精度が上がります。</p>

    <div class="actions">
      <button id="btn-camera" class="primary">カメラで撮る</button>
      <button id="btn-pick">ファイルを選ぶ</button>
    </div>
    <!-- 端末にカメラが無い/許可されない場合は、こちらが受け皿になる -->
    <input id="face-file" type="file" accept="image/*" class="hidden">
    <input id="face-capture" type="file" accept="image/*" capture="user" class="hidden">

    <!-- カメラを開いているあいだだけ出す -->
    <div id="camera-panel" class="camera hidden">
      <video id="camera-view" class="camera-view" playsinline muted></video>
      <div class="actions">
        <button id="btn-shoot" class="primary">これで撮る</button>
        <button id="btn-camera-cancel">やめる</button>
      </div>
    </div>

    <div id="face-out" class="out"></div>
  </section>

  <section class="card">
    <h2>試着してみる</h2>
    <p class="note">キャラに寄せたウィッグと衣装の候補を出します。どれにするかを決めるのはあなたです。</p>
    <div id="fitting-out" class="out"></div>
  </section>
</main>

<script type="module" src="/static/js/pages/prep.js?v=45"></script>
</body>
</html>
